# ===== PRODUÇÃO (ativado com SPRING_PROFILES_ACTIVE=prod) =====
# Sem valores padrão de propósito: se faltar alguma variável, a aplicação NÃO sobe.

# Banco PostgreSQL. Ex.: jdbc:postgresql://HOST:5432/marketplacedb?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Admin (obrigatório)
app.admin.email=${ADMIN_EMAIL}
app.admin.senha=${ADMIN_SENHA}

# Chave do JWT (obrigatória; mínimo 32 caracteres)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:60}

# Servidor atrás de proxy HTTPS (Render, Railway, nginx...): enxerga o IP real e https
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.compression.enabled=true

# Nunca devolver stacktrace/mensagem interna ao navegador
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

logging.level.root=INFO