<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar - Marketplace de Doações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="navbar"></div>

    <main class="container py-4">
        <div id="alerta"></div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h4 mb-3">Entrar</h2>
                        <form id="form-login">
                            <div class="mb-3">
                                <label class="form-label" for="login-email">Email</label>
                                <input type="email" class="form-control" id="login-email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="login-senha">Senha</label>
                                <input type="password" class="form-control" id="login-senha" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Entrar</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h4 mb-3">Criar conta</h2>
                        <form id="form-cadastro">
                            <div class="mb-3">
                                <label class="form-label" for="cad-nome">Nome</label>
                                <input type="text" class="form-control" id="cad-nome" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="cad-email">Email</label>
                                <input type="email" class="form-control" id="cad-email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="cad-senha">Senha (mínimo 6 caracteres)</label>
                                <input type="password" class="form-control" id="cad-senha" minlength="6" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Cadastrar e entrar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        // Chegar aqui começa uma sessão nova
        limparSessao();
        renderNavbar();

        async function entrar(email, senha) {
            const dados = await api('/auth/login', {
                method: 'POST',
                body: JSON.stringify({ email, senha })
            });
            salvarSessao(dados);
            window.location.href = 'index.html';
        }

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            mostrarAlerta('');
            try {
                await entrar(
                    document.getElementById('login-email').value,
                    document.getElementById('login-senha').value
                );
            } catch (erro) {
                mostrarAlerta(erro.message);
            }
        });

        document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            mostrarAlerta('');
            const nome = document.getElementById('cad-nome').value;
            const email = document.getElementById('cad-email').value;
            const senha = document.getElementById('cad-senha').value;
            try {
                await api('/usuarios', {
                    method: 'POST',
                    body: JSON.stringify({ nome, email, senha })
                });
                await entrar(email, senha);
            } catch (erro) {
                mostrarAlerta(erro.message);
            }
        });
    </script>
</body>
</html>
