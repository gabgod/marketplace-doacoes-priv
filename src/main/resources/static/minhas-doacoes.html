<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minhas doações - Marketplace de Doações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="navbar"></div>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3 mb-0">Minhas doações</h1>
            <a href="doar.html" class="btn btn-primary">Nova doação</a>
        </div>

        <div id="alerta"></div>

        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Data</th>
                            <th>Instituição</th>
                            <th>Tipo</th>
                            <th>Detalhes</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-tabela"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        const CORES_STATUS = { PENDENTE: 'warning text-dark', CONFIRMADA: 'success', CANCELADA: 'secondary' };
        const ROTULOS_TIPO = { DINHEIRO: 'Dinheiro', ITEM: 'Item' };

        let instituicoesPorId = {};
        let doacoesPorId = {};

        function badgeStatus(status) {
            return `<span class="badge bg-${CORES_STATUS[status] || 'secondary'}">${esc(status)}</span>`;
        }

        function detalhes(d) {
            const texto = d.descricao ? esc(d.descricao) : '';
            if (d.tipo === 'DINHEIRO') {
                return formatarDinheiro(d.valor) + (texto ? ' <span class="text-muted">— ' + texto + '</span>' : '');
            }
            const unidades = d.quantidade ? d.quantidade + (d.quantidade === 1 ? ' unidade' : ' unidades') : '';
            return unidades
                ? unidades + (texto ? ' <span class="text-muted">— ' + texto + '</span>' : '')
                : texto;
        }

        if (exigirLogin()) {
            if (getRole() === 'INSTITUICAO') {
                window.location.href = 'painel-instituicao.html';
            } else {
                renderNavbar();
                carregar();
            }
        }

        async function carregar() {
            if (new URLSearchParams(window.location.search).get('ok')) {
                mostrarAlerta('Doação registrada! Ela aparece como pendente até ser confirmada pela instituição.', 'success');
            }

            const corpo = document.getElementById('corpo-tabela');
            try {
                const [eu, instituicoes] = await Promise.all([api('/usuarios/me'), api('/instituicoes')]);
                instituicoesPorId = Object.fromEntries(instituicoes.map(i => [i.id, i]));

                // O filtro por usuário faz o ADMIN também ver só as próprias doações aqui
                const doacoes = await api('/doacoes?usuarioId=' + eu.id);
                doacoesPorId = Object.fromEntries(doacoes.map(d => [d.id, d]));

                if (doacoes.length === 0) {
                    corpo.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Você ainda não fez nenhuma doação.</td></tr>';
                    return;
                }

                doacoes.sort((a, b) => new Date(b.dataDoacao) - new Date(a.dataDoacao));

                corpo.innerHTML = doacoes.map(d => {
                    const instituicao = instituicoesPorId[d.instituicaoId];
                    const podePagar = d.tipo === 'DINHEIRO' && d.status === 'PENDENTE'
                        && instituicao && instituicao.chavePix;
                    const acoes = podePagar
                        ? `<button class="btn btn-sm btn-outline-primary" onclick="pagarPix(${d.id})">Pagar com Pix</button>`
                        : '<span class="text-muted">—</span>';

                    return `
                        <tr>
                            <td>${formatarData(d.dataDoacao)}</td>
                            <td>${esc(instituicao ? instituicao.nome : 'Instituição #' + d.instituicaoId)}</td>
                            <td>${ROTULOS_TIPO[d.tipo] || esc(d.tipo)}</td>
                            <td>${detalhes(d)}</td>
                            <td>${badgeStatus(d.status)}</td>
                            <td class="text-nowrap">${acoes}</td>
                        </tr>`;
                }).join('');
            } catch (erro) {
                mostrarAlerta(erro.message);
            }
        }

        function pagarPix(id) {
            const doacao = doacoesPorId[id];
            const instituicao = instituicoesPorId[doacao.instituicaoId];
            abrirModalPix('Pagar com Pix', resumoPix(instituicao, doacao.valor), {
                chave: instituicao.chavePix,
                nome: instituicao.nome,
                cidade: instituicao.cidade,
                valor: doacao.valor
            });
        }
    </script>
</body>
</html>
