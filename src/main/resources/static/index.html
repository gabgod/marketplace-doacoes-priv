<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marketplace de Doações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="navbar"></div>

    <main class="container py-4">
        <div class="p-4 mb-4 bg-white rounded shadow-sm">
            <h1 class="h3">Doe para instituições de Porto Alegre e região</h1>
            <p class="text-muted mb-0">
                Encontre uma instituição que combine com você e doe em dinheiro ou em itens. Sem cadastro, use o <strong>Pix rápido</strong>.
            </p>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-2 align-items-end">
                    <div class="col-lg-4">
                        <label class="form-label small" for="busca">Buscar</label>
                        <input type="search" class="form-control" id="busca" placeholder="Nome, cidade, o que precisam...">
                    </div>
                    <div class="col-md-6 col-lg-3">
                        <label class="form-label small" for="filtro-area">Quero ajudar</label>
                        <select class="form-select" id="filtro-area">
                            <option value="">Qualquer causa</option>
                        </select>
                    </div>
                    <div class="col-md-6 col-lg-3">
                        <label class="form-label small" for="filtro-tipo">Tenho para doar</label>
                        <select class="form-select" id="filtro-tipo">
                            <option value="">Qualquer item</option>
                        </select>
                    </div>
                    <div class="col-lg-2">
                        <button type="button" class="btn btn-outline-secondary w-100" id="btn-limpar">Limpar filtros</button>
                    </div>
                </div>
                <div class="form-check mt-3">
                    <input class="form-check-input" type="checkbox" id="filtro-necessidades">
                    <label class="form-check-label" for="filtro-necessidades">Só instituições que estão precisando de algo agora</label>
                </div>
                <div class="small text-muted mt-2" id="contagem"></div>
            </div>
        </div>

        <div id="alerta"></div>
        <div id="lista-instituicoes" class="row g-3"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        const podeDoar = getRole() !== 'INSTITUICAO';

        let instituicoes = [];
        let instituicoesPorId = {};
        let necessidadesPorInstituicao = {};
        let textoBusca = {};

        const campoBusca = document.getElementById('busca');
        const filtroArea = document.getElementById('filtro-area');
        const filtroTipo = document.getElementById('filtro-tipo');
        const filtroNecessidades = document.getElementById('filtro-necessidades');

        renderNavbar();
        preencherFiltros();
        carregarInstituicoes();

        function preencherFiltros() {
            AREAS_ATUACAO.forEach(c => filtroArea.insertAdjacentHTML('beforeend',
                `<option value="${c.codigo}">${esc(c.rotulo)}</option>`));
            TIPOS_ITEM.forEach(c => filtroTipo.insertAdjacentHTML('beforeend',
                `<option value="${c.codigo}">${esc(c.rotulo)}</option>`));
        }

        function montarTextoBusca(i) {
            const necessidades = (necessidadesPorInstituicao[i.id] || [])
                .map(n => n.item + ' ' + (n.descricao || ''));
            return normalizarBusca([
                i.nome, i.cidade, i.endereco, i.descricao,
                ...(i.areasAtuacao || []).map(c => rotulo(AREAS_ATUACAO, c)), i.outraArea,
                ...(i.tiposAceitos || []).map(c => rotulo(TIPOS_ITEM, c)), i.outroTipoAceito,
                ...necessidades
            ].filter(Boolean).join(' '));
        }

        function filtrar() {
            const termos = normalizarBusca(campoBusca.value).split(/\s+/).filter(Boolean);
            const area = filtroArea.value;
            const tipo = filtroTipo.value;
            const soNecessidades = filtroNecessidades.checked;

            return instituicoes.filter(i => {
                if (area && !(i.areasAtuacao || []).includes(area)) return false;
                if (tipo && !(i.tiposAceitos || []).includes(tipo)) return false;
                if (soNecessidades && (necessidadesPorInstituicao[i.id] || []).length === 0) return false;
                return termos.every(t => textoBusca[i.id].includes(t));
            });
        }

        function blocoCategorias(i) {
            const areas = etiquetas(i.areasAtuacao, AREAS_ATUACAO, i.outraArea, 'text-bg-secondary');
            const aceitos = etiquetas(i.tiposAceitos, TIPOS_ITEM, i.outroTipoAceito, 'text-bg-light border');

            return (areas ? `<div class="mb-2">${areas}</div>` : '')
                + (aceitos
                    ? `<div class="small text-muted mb-1">Costuma receber:</div><div class="mb-2">${aceitos}</div>`
                    : '');
        }

        function blocoNecessidades(instituicao, lista) {
            if (!lista || lista.length === 0) {
                return '';
            }

            const itens = lista.slice(0, 3).map(n => `
                <li class="mb-2">
                    <strong>${esc(n.item)}</strong>${n.quantidade ? ' (' + n.quantidade + ')' : ''}
                    <div class="small text-muted">
                        até ${formatarDataCurta(n.dataLimite)} · ${esc(textoPrazo(n.dataLimite))}
                        ${podeDoar ? ` · <a href="doar.html?instituicaoId=${instituicao.id}&necessidadeId=${n.id}">Quero doar isto</a>` : ''}
                    </div>
                </li>`).join('');

            const mais = lista.length > 3
                ? `<div class="small text-muted">e mais ${lista.length - 3}</div>`
                : '';

            return `
                <div class="mt-2">
                    <div class="small fw-semibold text-uppercase text-danger">Precisam agora</div>
                    <ul class="list-unstyled mb-1 mt-1">${itens}</ul>
                    ${mais}
                </div>`;
        }

        function botoes(instituicao) {
            if (!podeDoar) {
                return '';
            }
            return `
                <div class="d-flex gap-2 mt-auto pt-3">
                    <a href="doar.html?instituicaoId=${instituicao.id}" class="btn btn-primary flex-fill">Doar</a>
                    ${instituicao.chavePix
                        ? `<button class="btn btn-outline-success flex-fill" onclick="pixRapido(${instituicao.id})">Pix rápido</button>`
                        : ''}
                </div>`;
        }

        function pixRapido(id) {
            abrirPixRapido(instituicoesPorId[id]);
        }

        function card(i) {
            return `
                <div class="col-md-6 col-lg-4">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">${esc(i.nome)}</h5>
                            <h6 class="card-subtitle mb-2 text-muted">${esc([i.endereco, i.cidade].filter(Boolean).join(' - '))}</h6>
                            ${blocoCategorias(i)}
                            <p class="card-text mb-1">${esc(i.descricao)}</p>
                            ${blocoNecessidades(i, necessidadesPorInstituicao[i.id])}
                            ${botoes(i)}
                        </div>
                    </div>
                </div>`;
        }

        function renderizar() {
            const lista = document.getElementById('lista-instituicoes');
            const contagem = document.getElementById('contagem');

            if (instituicoes.length === 0) {
                contagem.textContent = '';
                lista.innerHTML = '<div class="col-12"><p class="text-muted">Nenhuma instituição cadastrada ainda.</p></div>';
                return;
            }

            const resultado = filtrar();
            contagem.textContent = 'Mostrando ' + resultado.length + ' de ' + instituicoes.length
                + (instituicoes.length === 1 ? ' instituição' : ' instituições');

            if (resultado.length === 0) {
                lista.innerHTML = '<div class="col-12"><p class="text-muted">Nenhuma instituição encontrada com esses filtros. Tente buscar por outro termo ou limpar os filtros.</p></div>';
                return;
            }

            lista.innerHTML = resultado.map(card).join('');
        }

        async function carregarInstituicoes() {
            try {
                const [lista, necessidades] = await Promise.all([
                    api('/instituicoes'),
                    api('/necessidades')
                ]);

                instituicoes = lista;
                instituicoesPorId = Object.fromEntries(instituicoes.map(i => [i.id, i]));

                necessidadesPorInstituicao = {};
                necessidades.forEach(n => {
                    if (!necessidadesPorInstituicao[n.instituicaoId]) {
                        necessidadesPorInstituicao[n.instituicaoId] = [];
                    }
                    necessidadesPorInstituicao[n.instituicaoId].push(n);
                });

                textoBusca = {};
                instituicoes.forEach(i => { textoBusca[i.id] = montarTextoBusca(i); });

                renderizar();
            } catch (erro) {
                mostrarAlerta(erro.message);
            }
        }

        campoBusca.addEventListener('input', renderizar);
        filtroArea.addEventListener('change', renderizar);
        filtroTipo.addEventListener('change', renderizar);
        filtroNecessidades.addEventListener('change', renderizar);

        document.getElementById('btn-limpar').addEventListener('click', () => {
            campoBusca.value = '';
            filtroArea.value = '';
            filtroTipo.value = '';
            filtroNecessidades.checked = false;
            renderizar();
        });
    </script>
</body>
</html>
