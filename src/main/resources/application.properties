spring.application.name=marketplace-doacoes

spring.datasource.url=jdbc:h2:mem:marketplacedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.admin.email=${ADMIN_EMAIL:admin@marketplace.com}
app.admin.senha=${ADMIN_SENHA:admin123}

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracao-minutos=60