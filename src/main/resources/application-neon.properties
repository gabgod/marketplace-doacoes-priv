# ===== NEON (usar junto com prod: SPRING_PROFILES_ACTIVE=prod,neon) =====
# A conexão vem de DATABASE_URL_UNPOOLED; veja NeonDataSourceConfig.
# Estes valores vazios substituem DB_URL, DB_USER e DB_PASSWORD do perfil prod.
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=

# Pool pequeno e sem conexões ociosas, para o Neon poder suspender o banco sem uso
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
